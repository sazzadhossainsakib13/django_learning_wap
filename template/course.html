{% extends 'master/base.html' %}

{% block title %}
    Course
{% endblock title %}
    
{% block table %}
   <table class="table">
  <thead>
    <tr>
      <th scope="col">title</th>
      <th scope="col">code</th>
      <th scope="col">credit</th>
    </tr>
  </thead>
  <tbody>
    
    {% for course in course_data %}
      <tr>
      <td>{{course.title}}</td>
      <td>{{course.code}}</td>
      <td>{{course.credit}}</td>
    </tr>
    {% endfor %}
      
    
    
  </tbody>
</table>  
{% endblock table %}
